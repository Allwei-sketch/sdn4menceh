                                        <label className="block text-xs text-slate-600 mb-1 font-medium">Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={adminPassword}
                                            onChange={(e) => setAdminPassword(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-xs focus:outline-none"
                                            placeholder="sakra4321"
                                        />
                                    </div>
                                    <p className="text-[10px] text-slate-400 italic">*Demo Credential: admin / sakra4321</p>
                                    <button type="submit" className="w-full bg-brand-blue text-white py-2.5 rounded-xl font-bold text-xs hover:bg-blue-900">
                                        Login Admin
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    <footer className="bg-slate-900 text-slate-300 py-12 px-4 border-t border-slate-800 text-xs">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8">
                            <div className="space-y-3">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 bg-brand-yellow rounded-full flex items-center justify-center text-slate-900 font-extrabold text-sm">
                                        SD
                                    </div>
                                    <span className="font-bold text-white text-sm">{profile.name}</span>
                                </div>
                                <p className="text-slate-400 text-xs leading-relaxed">{profile.slogan}</p>
                            </div>
                            <div>
                                <h4 className="font-bold text-white text-sm mb-3">Navigasi Cepat</h4>
                                <ul className="space-y-2 text-xs">
                                    <li><button onClick={() => setActiveTab('profil')} className="hover:text-brand-yellow">Profil Sekolah</button></li>
                                    <li><button onClick={() => setActiveTab('guru')} className="hover:text-brand-yellow">Guru & Tendik</button></li>
                                    <li><button onClick={() => setActiveTab('berita')} className="hover:text-brand-yellow">Berita Sekolah</button></li>
                                    <li><button onClick={() => setActiveTab('ppdb')} className="hover:text-brand-yellow">Informasi PPDB</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-white text-sm mb-3">Kontak Resmi</h4>
                                <p className="text-xs text-slate-400">{profile.address}</p>
                                <p className="text-xs text-slate-400 mt-2">Kabupaten Lombok Timur, NTB</p>
                            </div>
                            <div>
                                <h4 className="font-bold text-white text-sm mb-3">Hak Akses & Keamanan</h4>
                                <p className="text-xs text-slate-400">Website resmi dikelola oleh tim admin {profile.name}. Data pendaftaran dilindungi sesuai kebijakan privasi.</p>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-8 pt-6 border-t border-slate-800 text-center text-slate-500 text-[11px]">
                            © 2026 {profile.name}. Hak cipta dilindungi.
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
